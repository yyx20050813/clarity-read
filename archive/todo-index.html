<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易待办清单</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f7fb;
      --surface: #ffffff;
      --text: #1d2939;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #3978f6;
      --primary-dark: #2864d8;
      --danger: #d92d20;
      --danger-bg: #fff1f0;
      --done: #98a2b3;
      --shadow: 0 18px 45px rgba(16, 24, 40, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
        "PingFang SC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .header p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .todo-panel {
      padding: clamp(20px, 5vw, 32px);
      background: var(--surface);
      border: 1px solid rgba(228, 231, 236, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .todo-form {
      display: flex;
      gap: 10px;
    }

    .todo-input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      color: var(--text);
      background: #fff;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .todo-input::placeholder {
      color: #98a2b3;
    }

    .todo-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(57, 120, 246, 0.14);
    }

    .add-button {
      flex: 0 0 auto;
      min-width: 76px;
      padding: 0 18px;
      border-radius: 6px;
      color: #fff;
      background: var(--primary);
      font-weight: 600;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button:hover {
      background: var(--primary-dark);
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 26px 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .summary strong {
      color: var(--text);
      font-weight: 600;
    }

    .clear-button {
      padding: 4px 0;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
    }

    .clear-button:hover {
      color: var(--danger);
    }

    .todo-list {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 10px 10px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .todo-item:hover {
      border-color: #c6d4ef;
      background: #fbfcff;
    }

    .todo-check {
      display: grid;
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin: 0;
      place-items: center;
      border: 1.5px solid #b4c0d0;
      border-radius: 50%;
      background: #fff;
      appearance: none;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .todo-check:hover {
      border-color: var(--primary);
    }

    .todo-check:checked {
      border-color: var(--primary);
      background: var(--primary);
    }

    .todo-check:checked::after {
      width: 9px;
      height: 5px;
      border-bottom: 2px solid #fff;
      border-left: 2px solid #fff;
      content: "";
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
      cursor: pointer;
    }

    .todo-item.completed .todo-text {
      color: var(--done);
      text-decoration: line-through;
    }

    .delete-button {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 5px;
      color: var(--muted);
      background: transparent;
      font-size: 19px;
      line-height: 1;
      transition: color 160ms ease, background 160ms ease;
    }

    .delete-button:hover,
    .delete-button:focus-visible {
      color: var(--danger);
      background: var(--danger-bg);
    }

    .empty-state {
      padding: 28px 16px 20px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .todo-form {
        gap: 8px;
      }

      .add-button {
        min-width: 68px;
        padding: 0 14px;
      }

      .todo-panel {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>我的待办清单</h1>
      <p>把要做的事，一件一件完成</p>
    </header>

    <section class="todo-panel" aria-label="待办清单">
      <form class="todo-form" id="todoForm">
        <label class="sr-only" for="todoInput">输入待办事项</label>
        <input
          class="todo-input"
          id="todoInput"
          type="text"
          maxlength="120"
          placeholder="接下来要做什么？"
          autocomplete="off"
        >
        <button class="add-button" type="submit">添加</button>
      </form>

      <div class="summary">
        <span id="summaryText">共 0 项，已完成 0 项</span>
        <button class="clear-button" id="clearCompleted" type="button">清除已完成</button>
      </div>

      <ul class="todo-list" id="todoList"></ul>
      <p class="empty-state" id="emptyState">还没有待办事项，添加一项开始吧。</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "simple-todo-list";

    const todoForm = document.querySelector("#todoForm");
    const todoInput = document.querySelector("#todoInput");
    const todoList = document.querySelector("#todoList");
    const emptyState = document.querySelector("#emptyState");
    const summaryText = document.querySelector("#summaryText");
    const clearCompletedButton = document.querySelector("#clearCompleted");

    let todos = loadTodos();

    function loadTodos() {
      try {
        const savedTodos = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(savedTodos) ? savedTodos : [];
      } catch {
        return [];
      }
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function createTodo(text) {
      return {
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text,
        completed: false
      };
    }

    function renderTodos() {
      todoList.innerHTML = "";

      todos.forEach((todo) => {
        const item = document.createElement("li");
        item.className = `todo-item${todo.completed ? " completed" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "todo-check";
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", `标记“${todo.text}”为完成`);
        checkbox.addEventListener("change", () => {
          todo.completed = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const text = document.createElement("label");
        text.className = "todo-text";
        text.textContent = todo.text;
        text.htmlFor = checkbox.id = `todo-${todo.id}`;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.title = "删除任务";
        deleteButton.setAttribute("aria-label", `删除“${todo.text}”`);
        deleteButton.textContent = "×";
        deleteButton.addEventListener("click", () => {
          todos = todos.filter((itemTodo) => itemTodo.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        item.append(checkbox, text, deleteButton);
        todoList.append(item);
      });

      const completedCount = todos.filter((todo) => todo.completed).length;
      summaryText.textContent = `共 ${todos.length} 项，已完成 ${completedCount} 项`;
      emptyState.hidden = todos.length > 0;
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();

      if (!text) {
        todoInput.focus();
        return;
      }

      todos.unshift(createTodo(text));
      saveTodos();
      renderTodos();
      todoInput.value = "";
      todoInput.focus();
    });

    clearCompletedButton.addEventListener("click", () => {
      const hasCompletedTodos = todos.some((todo) => todo.completed);
      if (!hasCompletedTodos) {
        return;
      }

      todos = todos.filter((todo) => !todo.completed);
      saveTodos();
      renderTodos();
    });

    renderTodos();
  </script>
</body>
</html>
